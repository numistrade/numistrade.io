<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Coin Shop</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .coin {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .coin img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #087f23;
    }

    .buy-button {
      display: inline-block;
      background: #ff9800;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .buy-button:hover {
      background: #e68900;
    }
  </style>
</head>

<body>

<header>
  <h1>🪙 My Coin Shop</h1>
  <p>Buy collectible coins</p>
</header>

<div class="container">

  <div class="coin">
    <img src="https://via.placeholder.com/200" alt="Coin">

    <h2>Sample Coin</h2>

    <p>Beautiful collectible coin.</p>

    <p class="price">₹500</p>

    <p>Available: 5</p>

    <a class="buy-button" href="#">
      Buy Now
    </a>
  </div>

</div>

</body>
</html>
